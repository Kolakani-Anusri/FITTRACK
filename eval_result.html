<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack – AI Report Evaluation</title>

  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>

  <!-- FULL PAGE HERO IMAGE (aidoc.jpg) WITH BORDER -->
  <div class="hero-wrapper eval-hero-wrapper">
    <img src="aidoc.jpg" class="hero-image eval-hero-image" alt="AI Doctor Evaluation">
  </div>

  <!-- MAIN CONTENT SECTION -->
  <section class="after-hero-section">
    <div id="eval-result-page" class="card evaluation-card">

      <h2>Your Report Evaluation</h2>

      <!-- USER SUMMARY -->
      <div id="result-user-summary">
        <h3>Your Details</h3>
        <div id="result-user-summary-content"></div>
      </div>

      <hr><br>

      <!-- AI GENERATED EVALUATION CONTENT (FILLED BY script.js / runEvaluation) -->
      <div id="detailed-report"></div>

      <!-- HIDDEN TEXT VERSION OF EVALUATION (USED FOR FINAL DOWNLOAD ONLY) -->
      <textarea id="eval-text" class="eval-textarea hidden" readonly></textarea>

      <br>

      <!-- (AI Voice Assistance section removed) -->

      <!-- NAVIGATION BUTTONS -->
      <div class="button-row">
        <button id="go-to-health-issues" class="primary-btn">
          Continue to Health Issues Selection
        </button>

        <button id="back-to-upload" class="secondary-btn">
          Back to Upload Page
        </button>
      </div>

    </div>
  </section>

  <!-- OWNER VIEW BUTTON -->
  <button class="owner-shortcut-btn" onclick="window.location.href='owner.html'">
    Owner View
  </button>

</body>
</html>
