<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack – User Registration</title>

  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body>

  <!-- FULLSCREEN BACKGROUND IMAGE (NO TEXT ON IT) -->
  <div class="register-fullscreen">
    <img src="background1.jpg" alt="Background" class="register-bg-image">
  </div>

  <!-- SCROLL DOWN TO REGISTRATION FORM -->
  <section class="after-hero-section">
    <div class="card register-card">

      <h2>User Registration</h2>

      <form id="registration-form">
        <label for="name"><strong>Full Name:</strong></label>
        <input type="text" id="name" required placeholder="Enter full name">

        <label for="age"><strong>Age:</strong></label>
        <input type="number" id="age" required placeholder="Enter age">

        <label for="height"><strong>Height (cm):</strong></label>
        <input type="number" id="height" required placeholder="Enter height in cm">

        <label for="weight"><strong>Weight (kg):</strong></label>
        <input type="number" id="weight" required placeholder="Enter weight in kg">

        <label for="gender"><strong>Gender:</strong></label>
        <select id="gender" required>
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>

        <label for="mobile"><strong>Mobile Number:</strong></label>
        <input type="tel" id="mobile" required placeholder="Enter mobile number">

        <label for="email"><strong>Email (optional):</strong></label>
        <input type="email" id="email" placeholder="Enter email">

        <label for="password"><strong>Create Password:</strong></label>
        <input type="password" id="password" required placeholder="Create a password">

        <button type="submit" class="primary-btn">Register & Continue</button>

        <p id="register-status" class="status-text"></p>
      </form>

    </div>
  </section>

  <!-- OWNER VIEW BUTTON -->
  <button class="owner-shortcut-btn" onclick="window.location.href='owner.html'">
    Owner View
  </button>

</body>
</html>
